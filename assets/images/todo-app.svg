<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#todoBg)"/>
  <rect x="70" y="30" width="460" height="290" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
  <text x="100" y="70" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Daily Tasks &amp; Focus Tracker</text>
  <!-- Input box -->
  <rect x="100" y="90" width="320" height="38" rx="8" fill="#1e293b" stroke="#475569" />
  <text x="115" y="114" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Add a new task...</text>
  <rect x="430" y="90" width="70" height="38" rx="8" fill="#6366f1" />
  <text x="465" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">+ Add</text>
  <!-- Task items -->
  <rect x="100" y="145" width="400" height="42" rx="8" fill="#1e293b" />
  <circle cx="120" cy="166" r="8" fill="#10b981" />
  <text x="140" y="171" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-decoration="line-through">Complete DSA practice problems</text>
  <rect x="100" y="197" width="400" height="42" rx="8" fill="#1e293b" stroke="#334155" />
  <circle cx="120" cy="218" r="8" fill="none" stroke="#6366f1" stroke-width="2" />
  <text x="140" y="223" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9">Review Computer Networks notes</text>
  <rect x="100" y="249" width="400" height="42" rx="8" fill="#1e293b" stroke="#334155" />
  <circle cx="120" cy="270" r="8" fill="none" stroke="#6366f1" stroke-width="2" />
  <text x="140" y="275" font-family="system-ui, sans-serif" font-size="13" fill="#f1f5f9">Build Portfolio Project with Bootstrap 5</text>
</svg>
