<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="130" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="3" filter="url(#shadow)" />
  <!-- Stylized avatar silhouette / monogram -->
  <g transform="translate(200, 160)" text-anchor="middle">
    <circle cx="0" cy="-20" r="45" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M-60 60 C-60 20, 60 20, 60 60" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2.5" />
    <text x="0" y="-8" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">NK</text>
  </g>
  <rect x="90" y="275" width="220" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="200" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="1">B.TECH 2ND YEAR</text>
</svg>
